<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic AI Chat - Spiritual Guide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
        
        body {
            font-family: 'Amiri', serif;
            background: linear-gradient(135deg, #0a1a3d 0%, #1e3c72 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><path d="M0,0h1000v1000H0Z" fill="none"/><path d="M500,700c-100,0-200-50-300-150-50-50-80-100-80-150s30-100,80-150c100-100,200-150,300-150s200,50,300,150c50,50,80,100,80,150s-30,100-80,150c-100,100-200,150-300,150Z" fill="rgba(255,255,255,0.05)"/><path d="M400,600a100,100,0,1,1,100-100A100,100,0,0,1,400,600Z" fill="rgba(255,255,255,0.1)"/></svg>') no-repeat center/cover, radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: glow 12s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes glow {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .chat-container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transform: perspective(1000px) rotateX(5deg);
        }

        .header {
            background: linear-gradient(135deg, #0a3d62 0%, #1e3c72 100%);
            color: #fff;
            padding: 25px;
            text-align: center;
            font-size: 40px;
            font-weight: 700;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.7);
        }

        .header::before {
            content: '🕌';
            font-size: 50px;
            margin-right: 15px;
            display: inline-block;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.7);
        }

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: rgba(30, 30, 30, 0.8);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message.ai .message-content {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-left-radius: 5px;
        }

        .message-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .user-avatar {
            background: #007bff;
            color: #fff;
        }

        .ai-avatar {
            background: #0a3d62;
            color: #fff;
        }

        .input-area {
            padding: 20px;
            background: rgba(20, 20, 20, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Ensures button has space */
            min-height: 60px; /* Prevents collapsing on mobile */
        }

        .input-area input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            outline: none;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-right: 10px; /* Space before button */
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-area button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            border: 2px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 20;
            min-width: 100px; /* Ensures button isn’t too small */
        }

        .input-area button:hover {
            transform: translateZ(10px) scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .input-area button::before {
            content: '➤ ';
        }

        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            font-size: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .quran-quote {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 20px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            transform: translateZ(10px);
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                transform: perspective(1000px) rotateX(0deg);
            }
            .header {
                font-size: 32px;
            }
            .message-content {
                font-size: 20px;
            }
            .input-area input, .input-area button {
                font-size: 20px;
            }
            .input-area button {
                padding: 12px 20px;
                min-width: 80px;
            }
            .quran-quote {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            Islamic AI Guide
        </div>
        <div class="messages" id="messages">
            <div class="message ai">
                <div class="message-avatar ai-avatar">🤖</div>
                <div class="message-content">
                    <strong>Assalamu Alaikum!</strong> I am your Islamic AI Companion, powered by authentic sources like the Quran and Hadith. How may I assist you in your spiritual journey today? Ask about faith, prayer, duas, or anything Islamic in any language.
                    <div class="quran-quote">"Indeed, with hardship comes ease." (Quran 94:6)</div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about Islam, Quran, or daily guidance..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const API_KEY = 'AIzaSyBzReLO6a1AYx2B471lNLHqU-Rd_C_umdQ';
        const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            const avatar = isUser ? '👤' : '🤖';
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = content;
            if (!isUser && Math.random() > 0.7) {
                const quote = document.createElement('div');
                quote.className = 'quran-quote';
                quote.textContent = "And whoever fears Allah - He will make for him a way out." (Quran 65:2);
                messageContent.appendChild(quote);
            }
            messageDiv.innerHTML = `<div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">${avatar}</div>`;
            messageDiv.appendChild(messageContent);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const input = userInput.value.trim();
            if (!input) {
                alert('Please enter a message to send.');
                return;
            }
            addMessage(input, true);
            userInput.value = '';
            addLoading();

            try {
                const response = await fetch(`${API_URL}?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are an Islamic AI Companion, providing answers based on authentic Islamic sources like the Quran and Hadith. Respond to the following query in the same language as the input, ensuring the response is respectful, accurate, and aligned with Islamic teachings. If the query is about Islamic practices, include relevant Quran verses or Hadith where applicable. For non-Islamic queries, provide a general response but encourage Islamic values. Query: ${input}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                removeLoading();
                if (data.candidates && data.candidates[0].content) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    addMessage(aiResponse, false);
                } else {
                    addMessage("Sorry, I couldn't process your request. Please try again.", false);
                }
            } catch (error) {
                removeLoading();
                addMessage("An error occurred. Please check your internet connection or try again later.", false);
                console.error('Error:', error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function addLoading() {
            const loading = document.createElement('div');
            loading.className = 'message ai loading';
            loading.innerHTML = `<div class="message-avatar ai-avatar">🤖</div><div class="message-content loading">Thinking... May Allah guide us.</div>`;
            messages.appendChild(loading);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeLoading() {
            const loading = messages.querySelector('.loading');
            if (loading) loading.remove();
        }
    </script>
</body>
</html>
