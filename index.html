<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic AI Guide - Spiritual Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d2d5e;
            --secondary-color: #1a4d8c;
            --accent-color: #fdd835;
            --text-color: #e0e0e0;
            --user-bubble-bg: #3f51b5;
            --ai-bubble-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.2);
            --box-shadow-light: 0 4px 20px rgba(0, 0, 0, 0.5);
            --box-shadow-heavy: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', 'Amiri', serif;
            background: linear-gradient(135deg, #0a1a3d 0%, #1e3c72 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-color);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><path d="M500,700c-100,0-200-50-300-150-50-50-80-100-80-150s30-100,80-150c100-100,200-150,300-150s200,50,300,150c50,50,80,100,80,150s-30,100-80,150c-100,100-200,150-300,150Z" fill="rgba(255,255,255,0.05)"/><path d="M400,600a100,100,0,1,1,100-100A100,100,0,0,1,400,600Z" fill="rgba(255,255,255,0.1)"/></svg>') no-repeat center/cover, radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: glow 15s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes glow {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .chat-container {
            width: 90%;
            max-width: 650px;
            height: 85vh;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 20px;
            box-shadow: var(--box-shadow-heavy);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.5s ease;
        }

        .chat-container:hover {
            transform: perspective(1000px) rotateX(0deg);
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #fff;
            padding: 25px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--accent-color);
            position: relative;
            font-family: 'Amiri', serif; /* Ensure header uses Amiri */
        }

        .header::before {
            content: '🕌';
            font-size: 3rem;
            margin-right: 15px;
            display: inline-block;
            animation: mosque-pulse 2s infinite;
        }

        @keyframes mosque-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: rgba(30, 30, 30, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: none; /* Firefox */
        }

        .messages::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        .message {
            display: flex;
            align-items: flex-start;
            animation: message-fade-in 0.5s ease;
        }

        @keyframes message-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
            text-align: right;
        }
        
        .message-content {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 1.1rem;
            line-height: 1.6;
            word-wrap: break-word;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease-in-out;
            font-family: 'Amiri', serif; /* Ensure message content uses Amiri */
        }

        .message-content:hover {
            transform: translateY(-2px);
        }

        .message.user .message-content {
            background: var(--user-bubble-bg);
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message.ai .message-content {
            background: var(--ai-bubble-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 5px;
        }
        
        .message-avatar {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            margin: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            overflow: hidden;
        }

        .user-avatar {
            background: var(--user-bubble-bg);
            color: #fff;
        }

        /* AI avatar styling for the Crescent Moon and Star icon */
        .ai-avatar {
            background: var(--secondary-color);
            color: #fff;
            font-size: 2rem;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }
        
        .ai-avatar span {
            display: inline-block;
            animation: icon-float 3s infinite ease-in-out;
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-area {
            padding: 20px;
            background: rgba(20, 20, 20, 0.9);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            outline: none;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            font-family: 'Amiri', serif; /* Ensure input text uses Amiri */
        }

        .input-area input:focus {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Amiri', serif; /* Ensure placeholder uses Amiri */
        }

        .input-area button {
            padding: 15px 25px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            font-family: 'Amiri', serif; /* Ensure button text uses Amiri */
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .quran-quote {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 1rem;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            font-family: 'Amiri', serif;
            font-style: italic;
        }
        
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            padding: 10px;
            font-family: 'Amiri', serif; /* Ensure loading text uses Amiri */
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                transform: perspective(1000px) rotateX(0deg);
            }
            .header {
                font-size: 2rem;
                padding: 20px;
            }
            .header::before {
                font-size: 2.5rem;
            }
            .message-content {
                font-size: 1rem;
            }
            .input-area {
                padding: 15px;
                flex-direction: column;
                gap: 10px;
            }
            .input-area input, .input-area button {
                width: 100%;
                font-size: 1rem;
                padding: 12px 20px;
            }
            .input-area button {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            Islamic AI
        </div>
        <div class="messages" id="messages">
            </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about Islam, Quran, or daily guidance..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        
        // YOUR GEMINI API KEY HAS BEEN ADDED HERE
        const API_KEY = 'AIzaSyBzReLO6a1AYx2B471lNLHqU-Rd_C_umdQ'; 
        
        const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';

        const quranQuotes = [
            `"Indeed, with hardship comes ease." (Quran 94:6)`,
            `"And whoever fears Allah - He will make for him a way out." (Quran 65:2)`,
            `"And seek help through patience and prayer." (Quran 2:45)`,
            `"Verily, in the remembrance of Allah do hearts find rest." (Quran 13:28)`
        ];

        // Function to add a message to the chat
        function addMessage(content, isUser, includeQuote = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            // Crescent Moon and Star Icon (Halal Icon)
            const aiIcon = '<span>&#x262A;</span>'; 
            const userIcon = '👤';

            const avatarContent = isUser ? userIcon : aiIcon;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = content;
            
            if (!isUser && includeQuote && Math.random() > 0.6) {
                const quote = document.createElement('div');
                quote.className = 'quran-quote';
                quote.textContent = quranQuotes[Math.floor(Math.random() * quranQuotes.length)];
                messageContent.appendChild(quote);
            }

            messageDiv.innerHTML = `<div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">${avatarContent}</div>`;
            messageDiv.appendChild(messageContent);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        // Add the initial AI welcome message on page load
        function addInitialMessage() {
            const initialMessage = `<strong>Assalamu Alaikum!</strong> I am your Islamic AI Companion. Powered by authentic sources like the Quran and Hadith, I am here to assist you in your spiritual journey. <br><br>Feel free to ask about faith, prayer, duas, or any aspect of Islam in any language.`;
            addMessage(initialMessage, false, true);
        }

        // Function to handle sending a message
        async function sendMessage() {
            const input = userInput.value.trim();
            if (!input) return;

            addMessage(input, true);
            userInput.value = '';
            addLoading();

            try {
                const response = await fetch(`${API_URL}?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are an Islamic AI Companion, providing answers based on authentic Islamic sources like the Quran and Hadith. Respond to the following query in the same language as the input, ensuring the response is respectful, accurate, and aligned with Islamic teachings. If the query is about Islamic practices, include relevant Quran verses or Hadith where applicable. For non-Islamic queries, provide a general response but encourage Islamic values. Query: ${input}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                removeLoading();
                if (data.candidates && data.candidates[0].content) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    addMessage(aiResponse, false, true);
                } else {
                    addMessage("Sorry, I couldn't process your request. Please try again later. Jazaakallahu Khairan.", false);
                }
            } catch (error) {
                removeLoading();
                addMessage("An error occurred. Please check your internet connection or try again later.", false);
                console.error('Error:', error);
            }
        }

        // Function to add a loading indicator
        function addLoading() {
            const loading = document.createElement('div');
            loading.className = 'message ai loading';
            // Crescent Moon and Star Icon for loading state
            loading.innerHTML = `<div class="message-avatar ai-avatar"><span>&#x262A;</span></div><div class="message-content loading">Thinking... May Allah guide us.</div>`;
            messages.appendChild(loading);
            messages.scrollTop = messages.scrollHeight;
        }

        // Function to remove the loading indicator
        function removeLoading() {
            const loading = messages.querySelector('.loading');
            if (loading) loading.remove();
        }

        // Handle Enter key press
        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // Initialize the chat on page load
        document.addEventListener('DOMContentLoaded', addInitialMessage);
    </script>
</body>
</html>
