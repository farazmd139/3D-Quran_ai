<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #333;
            --text-color: #f0f0f0;
            --accent-color: #007bff;
            --accent-hover-color: #0056b3;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        header {
            text-align: center;
            padding: 10px 0;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
        }
        .image-display {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            background-color: var(--secondary-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        #generated-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 8px;
        }
        .placeholder-text {
            color: #888;
            font-size: 1.2rem;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid var(--accent-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
            display: none;
            position: absolute;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .prompt-area {
            display: flex;
            gap: 10px;
            width: 100%;
            padding-bottom: 20px;
        }
        #prompt-input {
            flex-grow: 1;
            padding: 15px;
            font-size: 1rem;
            border: 1px solid var(--secondary-color);
            border-radius: 8px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            outline: none;
        }
        #prompt-input:focus {
            border-color: var(--accent-color);
        }
        #generate-btn {
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #generate-btn:hover {
            background-color: var(--accent-hover-color);
        }
        #generate-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        footer {
            font-size: 0.8rem;
            color: #888;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AI इमेज जेनरेटर</h1>
        </header>

        <div class="image-display">
            <div class="placeholder-text" id="placeholder">आपकी बनाई गई इमेज यहाँ दिखेगी</div>
            <img id="generated-image" src="" alt="Generated AI Image">
            <div class="loader" id="loader"></div>
        </div>

        <div class="prompt-area">
            <input type="text" id="prompt-input" placeholder="एक इमेज बनाने के लिए कुछ लिखें...">
            <button id="generate-btn">बनाएं (Generate)</button>
        </div>
    </div>
    
    <footer>
        DeepAI API द्वारा संचालित
    </footer>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const promptInput = document.getElementById('prompt-input');
        const generatedImage = document.getElementById('generated-image');
        const loader = document.getElementById('loader');
        const placeholder = document.getElementById('placeholder');

        // ध्यान दें: यह एक डेमो API कुंजी है। व्यावसायिक उपयोग के लिए, DeepAI से अपनी खुद की कुंजी प्राप्त करें।
        const API_KEY = 'AIzaSyBzReLO6a1AYx2B471lNLHqU-Rd_C_umdQ';

        generateBtn.addEventListener('click', generateImage);
        promptInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                generateImage();
            }
        });

        async function generateImage() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert('कृपया इमेज बनाने के लिए कुछ टेक्स्ट लिखें।');
                return;
            }

            // UI को अपडेट करें
            setLoading(true);

            try {
                const response = await fetch('https://api.deepai.org/api/text2img', {
                    method: 'POST',
                    headers: {
                        'api-key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: prompt,
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${errorData.err || response.statusText}`);
                }

                const data = await response.json();
                
                // इमेज दिखाएं
                generatedImage.src = data.output_url;
                generatedImage.style.display = 'block';
                placeholder.style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
                alert('माफ़ करें, इमेज बनाने में कोई समस्या हुई। कृपया बाद में प्रयास करें।\n' + error.message);
                placeholder.style.display = 'block';
                generatedImage.style.display = 'none';
            } finally {
                // लोडिंग बंद करें
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loader.style.display = 'block';
                generateBtn.disabled = true;
                generateBtn.textContent = 'बना रहा है...';
                placeholder.style.display = 'none';
                generatedImage.style.display = 'none';
            } else {
                loader.style.display = 'none';
                generateBtn.disabled = false;
                generateBtn.textContent = 'बनाएं (Generate)';
            }
        }
    </script>

</body>
</html>
